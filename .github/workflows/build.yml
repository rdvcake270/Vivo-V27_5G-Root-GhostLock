name: Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      # Changes to the payload source or APK source trigger a rebuild.
      - 'payload/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle.kts'
      - '*.properties'
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release'
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 9.5.1 / AGP 9.2.1, and the app compiles against Java 17.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The native probe is built through CMake, and AGP will otherwise try to
      # fetch these mid-build. Installing them up front keeps a provisioning
      # failure separate from a compile failure.
      - name: Install SDK components
        run: |
          ndk=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cmake=$(grep -oP 'version\s*=\s*"\K[0-9.]+' app/build.gradle.kts | head -1)
          echo "ndk=$ndk cmake=$cmake"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ndk" "cmake;$cmake" > /dev/null

      - name: Set environment
        run: |
          {
            app_version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            # A tag can only have one GitHub release. Keep the Android app
            # version independent and give every release build a unique tag.
            echo "version=v${app_version}-build.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            echo "commit=$(echo ${{ github.sha }} | cut -c-7)"
            echo "repo=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}"
          } >> "$GITHUB_ENV"

      # Fail before a 3-minute build rather than after it.
      - name: Release preflight
        if: github.event.inputs.release == 'true'
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$STORE_FILE" ]; then
            echo "::error::release requires the signing secrets to be set"
            echo "  STORE_FILE     base64 of the release keystore (JKS)"
            echo "  STORE_PASSWORD keystore password"
            echo "  KEY_ALIAS      signing alias"
            echo "  KEY_PASSWORD   key password"
            echo
            echo "a release keystore is required; debug builds use the local"
            echo "Android debug keystore and are not suitable for releases."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${{ env.version }}" >/dev/null 2>&1; then
            echo "::error::generated release tag ${{ env.version }} already exists — rerun the workflow"
            exit 1
          fi

      - name: Build
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ndk=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            # Release assets publish the standalone helpers; the APK downloads
            # the app payload and matching ksud daemon during installation.
            make -C payload ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ndk" all
            printf '%s' "$STORE_FILE" | base64 -d > app/release.jks
            ./gradlew assembleRelease --no-daemon
            mkdir -p release-assets
            cp -f app/build/outputs/apk/release/app-release.apk \
              "release-assets/${{ env.repo }}-${{ env.version }}.apk"
            cp -f payload/build/cve-2026-43499-app.so \
              "release-assets/${{ env.repo }}-${{ env.version }}-app.so"
            cp -f payload/build/cve-2026-43499-root \
              "release-assets/${{ env.repo }}-${{ env.version }}-root"
            cp -f payload/build/cve-2026-43499 \
              "release-assets/${{ env.repo }}-${{ env.version }}-preload"
            cp -f payload/artifacts/ksud-vivo-v27-5g \
              "release-assets/${{ env.repo }}-${{ env.version }}-ksud"
          else
            make -C payload ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ndk" payload
            ./gradlew assembleDebug --no-daemon
          fi

      # Assert that the APK is signed. Release builds must not use a debug key.
      - name: Verify signature
        run: |
          set -o pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            apk="release-assets/${{ env.repo }}-${{ env.version }}.apk"
          else
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          grep 'certificate DN' certs.txt >/dev/null || {
            echo "::error::apksigner printed no certificate for $apk"
            exit 1
          }
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            if grep -q 'Android Debug' certs.txt; then
              echo "::error::release APK is signed with the public debug key"
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: github.event.inputs.release != 'true'
        with:
          name: ${{ env.repo }}(${{ env.version }}@${{ env.commit }})
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.release == 'true'
        with:
          tag_name: ${{ env.version }}
          draft: false
          prerelease: false
          files: release-assets/*
