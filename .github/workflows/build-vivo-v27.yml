name: Build Vivo V27 5G

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vivo-v27.yml'
      - 'app/**'
      - 'payload/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle.kts'
      - '*.properties'
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release'
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Build Vivo V27 5G
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components
        run: |
          ndk=$(grep -oP 'ndkVersion\\s*=\\s*"\\K[^"]+' app/build.gradle.kts)
          cmake=$(grep -oP 'version\\s*=\\s*"\\K[0-9.]+' app/build.gradle.kts | head -1)
          echo "ndk=$ndk cmake=$cmake"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ndk" "cmake;$cmake" > /dev/null

      - name: Set environment
        run: |
          {
            app_version=$(grep -oP 'versionName\\s*=\\s*"\\K[^"]+' app/build.gradle.kts)
            echo "version=v${app_version}-vivo-v27-build.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            echo "commit=$(echo ${{ github.sha }} | cut -c-7)"
            echo "repo=${GITHUB_REPOSITORY#${GITHUB_REPOSITORY_OWNER}/}"
            echo "payload_target=vivo-v27-5g"
          } >> "$GITHUB_ENV"

      - name: Release preflight
        if: github.event.inputs.release == 'true'
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$STORE_FILE" ]; then
            echo "::error::release requires STORE_FILE, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets"
            exit 1
          fi
          if [ ! -s "payload/artifacts/ksud-vivo-v27-5g" ]; then
            echo "::error::missing payload/artifacts/ksud-vivo-v27-5g"
            echo "A Vivo V27-specific verified ksud artifact is required for a release."
            echo "The repository currently contains only ksud-iqoo-z9-5g."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${{ env.version }}" >/dev/null 2>&1; then
            echo "::error::generated release tag ${{ env.version }} already exists — rerun the workflow"
            exit 1
          fi

      - name: Build
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ndk=$(grep -oP 'ndkVersion\\s*=\\s*"\\K[^"]+' app/build.gradle.kts)
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            make -C payload TARGET=vivo-v27-5g ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ndk" all
            printf '%s' "$STORE_FILE" | base64 -d > app/release.jks
            ./gradlew assembleRelease --no-daemon
            mkdir -p release-assets
            cp -f app/build/outputs/apk/release/app-release.apk \
              "release-assets/${{ env.repo }}-${{ env.version }}.apk"
            cp -f payload/build/cve-2026-43499-app.so \
              "release-assets/${{ env.repo }}-${{ env.version }}-app.so"
            cp -f payload/build/cve-2026-43499-root \
              "release-assets/${{ env.repo }}-${{ env.version }}-root"
            cp -f payload/build/cve-2026-43499 \
              "release-assets/${{ env.repo }}-${{ env.version }}-preload"
            cp -f payload/artifacts/ksud-vivo-v27-5g \
              "release-assets/${{ env.repo }}-${{ env.version }}-ksud"
          else
            make -C payload TARGET=vivo-v27-5g ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ndk" payload
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Verify signature
        run: |
          set -o pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            apk="release-assets/${{ env.repo }}-${{ env.version }}.apk"
          else
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          grep 'certificate DN' certs.txt >/dev/null || {
            echo "::error::apksigner printed no certificate for $apk"
            exit 1
          }
          if [ "${{ github.event.inputs.release }}" = "true" ] && grep -q 'Android Debug' certs.txt; then
            echo "::error::release APK is signed with the public debug key"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: github.event.inputs.release != 'true'
        with:
          name: ${{ env.repo }}-vivo-v27(${{ env.version }}@${{ env.commit }})
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.release == 'true'
        with:
          tag_name: ${{ env.version }}
          draft: false
          prerelease: false
          files: release-assets/*
