name: Build Vivo V27 Payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vivo-v27.yml'
      - 'payload/**'
  pull_request:
    paths:
      - '.github/workflows/build-vivo-v27.yml'
      - 'payload/**'
  workflow_dispatch:

jobs:
  build-payload:
    name: Build Vivo V27 native payload
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          ndk_version=28.2.13676358
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk_version" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Build payload
        run: |
          make -C payload \
            TARGET=vivo-v27-5g \
            ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            all

      - name: Show build outputs
        run: |
          file payload/build/cve-2026-43499
          file payload/build/cve-2026-43499-app.so
          file payload/build/cve-2026-43499-root
          sha256sum \
            payload/build/cve-2026-43499 \
            payload/build/cve-2026-43499-app.so \
            payload/build/cve-2026-43499-root

      - name: Upload native payload
        uses: actions/upload-artifact@v4
        with:
          name: vivo-v27-5g-payload-${{ github.sha }}
          path: |
            payload/build/cve-2026-43499
            payload/build/cve-2026-43499-app.so
            payload/build/cve-2026-43499-root
          if-no-files-found: error
